- name: Setup Monitoring Stack
  hosts: monitoring
  become: yes

  tasks:

    - name: Install packages
      apt:
        name:
          - docker.io
          - docker-compose
          - python3
          - python3-pip
        update_cache: yes
    
    - name: Create env file on VM
      run: |
        ssh ubuntu@${{ env.VM_IP }} << EOF
        echo "GITHUB_TOKEN=${{ secrets.MY_PAT }}" > /opt/monitoring/.env
        EOF
        
    - name: Enable Docker
      service:
        name: docker
        state: started
        enabled: yes
            
    - name: Copy webhook
      copy:
        src: "{{ playbook_dir }}/../../webhook/"
        dest: /opt/webhook/

    - name: Copy monitoring stack
      copy:
        src: ../../docker/
        dest: /opt/monitoring/

        
    - name: Run docker compose
      shell: |
        cd /opt/monitoring
        docker-compose up -d
