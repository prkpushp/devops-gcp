- name: Setup Monitoring Stack
  hosts: monitoring
  become: yes

  tasks:

    - name: Install packages
      apt:
        name:
          - docker.io
          - docker-compose
          - python3
          - nginx
          - python3-pip
        update_cache: yes
    
    - name: Create env file on VM
      copy:
        dest: /opt/monitoring/.env
        content: |
          GITHUB_TOKEN={{ github_pat }}
        
    - name: Enable Docker
      service:
        name: docker
        state: started
        enabled: yes
            
    - name: Copy webhook
      copy:
        src: "{{ playbook_dir }}/../../webhook/"
        dest: /opt/webhook/

    - name: Copy monitoring stack
      copy:
        src: ../../docker/
        dest: /opt/monitoring/

    - name: Deploy Alertmanager config
      template:
        src: ../templates/alertmanager.yml.j2
        dest: /etc/alertmanager/alertmanager.yml

    - name: Restart Alertmanager
      command: docker restart monitoring_alertmanager_1
        
    - name: Clean old containers
      shell: |
        cd /opt/monitoring
        docker-compose down --remove-orphans || true
        docker rm -f webhook || true
        docker system prune -f || true
        
    - name: Run docker compose
      shell: |
        cd /opt/monitoring
        docker-compose up -d
