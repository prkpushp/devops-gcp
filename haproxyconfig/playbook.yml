---
- name: Configure HAProxy and Apache
  hosts: haproxies # Target only the haproxy hosts
  become: yes
  vars:
    apache_package: apache2
    haproxy_package: haproxy
    # Note: ssh_user and ssh_private_key_path will be resolved from inventory/environment
    # For dynamic IP resolution, we use hostvars[host]['ansible_host'] in the template.

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Apache and HAProxy
      apt:
        name:
          - "{{ apache_package }}"
          - "{{ haproxy_package }}"
        state: present

    - name: Create a simple Apache index.html for testing
      copy:
        content: |
          <html>
          <head><title>Backend Server {{ inventory_hostname }}</title></head>
          <body>
            <h1>Hello from {{ inventory_hostname }}!</h1>
            <p>This is a backend server managed by Ansible.</p>
          </body>
          </html>
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Template HAProxy configuration
      template:
        src: haproxy.cfg.j2
        dest: /etc/haproxy/haproxy.cfg
      notify:
        - Restart HAProxy

    - name: Ensure HAProxy service is enabled and running
      systemd:
        name: haproxy
        enabled: yes
        state: started

  handlers:
    - name: Restart HAProxy
      systemd:
        name: haproxy
        state: restarted
        daemon_reload: yes
