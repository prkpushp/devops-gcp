name: Monitoring Provision Pipeline

on:
  workflow_dispatch:

jobs:
  provision:
    runs-on: ubuntu-latest

    env:
      REGION: asia-south1
      ZONE: asia-south1-a

    steps:

      - uses: actions/checkout@v4

      - name: Authenticate GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Setup GCloud SDK
        uses: google-github-actions/setup-gcloud@v2


      - name: Extract Project ID
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > sa.json
          PROJECT_ID=$(jq -r '.project_id' sa.json)
          echo "PROJECT_ID=$PROJECT_ID" >> $GITHUB_ENV
          echo "Detected Project ID: $PROJECT_ID"

      # ==================================================
      # Create Terraform Backend Bucket
      # ==================================================

      - name: Create Terraform Backend Bucket
        run: |
          gsutil ls -b gs://$PROJECT_ID >/dev/null 2>&1 || \
          gsutil mb -p $PROJECT_ID -l $REGION gs://$PROJECT_ID
      # ==================================================
      # Generate backend.tf
      # ==================================================

      - name: Generate backend.tf
        run: |
          cat <<EOF > monitoring/terraform/backend.tf
          terraform {
            backend "gcs" {
              bucket = "$PROJECT_ID"
              prefix = "monitoring/dev"
            }
          }
          EOF
          
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: monitoring/terraform
        run: terraform init

      - name: Terraform Format
        working-directory: cloudscaleops/terraform/environments/dev
        run: terraform fmt -recursive
        

      - name: Terraform Plan
        working-directory: cloudscaleops/terraform/environments/dev
        run: |
          terraform plan \
          -var-file="dev.tfvars" \
          -var="project_id=$PROJECT_ID" \
          -var="region=$REGION" \
          -var="zone=$ZONE" \
          -var="ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}"
      # ==================================================
      # Terraform Apply
      # ==================================================

      - name: Terraform Apply
        working-directory: cloudscaleops/terraform/environments/dev
        run: |
          terraform apply -auto-approve \
          -var-file="dev.tfvars" \
          -var="project_id=$PROJECT_ID" \
          -var="region=$REGION" \
          -var="zone=$ZONE" \
          -var="ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}"
