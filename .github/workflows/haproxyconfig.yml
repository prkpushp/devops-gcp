name: HAProxy Configuration and Deployment

on:
  push:
    branches:
      - main # Or your main deployment branch
  workflow_dispatch: # Allows manual triggering

jobs:
  deploy_haproxy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7 # Specify your desired Terraform version

      - name: Terraform Init
        id: tf_init
        run: terraform init
        working-directory: ./haproxyconfig
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ secrets.GCP_REGION }} # Assuming GCP_REGION is a secret
          TF_VAR_ssh_user: ${{ secrets.ANSIBLE_SSH_USER }} # Assuming this is defined as a secret
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

      - name: Terraform Apply
        id: tf_apply
        run: terraform apply -auto-approve
        working-directory: ./haproxyconfig
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ secrets.GCP_REGION }}
          TF_VAR_ssh_user: ${{ secrets.ANSIBLE_SSH_USER }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

      - name: Get Terraform Outputs (VM IPs and Names)
        id: tf_outputs
        run: |
          echo "Instance IPs: $(terraform output -json instance_public_ips)"
          echo "Instance Names: $(terraform output -json instance_names)"
          # Output IPs as a GitHub Actions output for use in subsequent steps
          echo "instance_ips=$(terraform output -json instance_public_ips | jq -r '. | @json')" >> $GITHUB_OUTPUT
          echo "instance_names=$(terraform output -json instance_names | jq -r '. | @json')" >> $GITHUB_OUTPUT
        working-directory: ./haproxyconfig
        # Ensure jq is available if not installed by default on runner
        # apt-get update && apt-get install -y jq

      - name: Set up Ansible
        # Using ansible-galaxy to install collection for GCE if needed, or assume it's available
        # For simplicity, we assume ansible-core and necessary modules are available on runner
        run: |
          pip install ansible-core --upgrade
          pip install ansible-inventory-generator # For dynamic inventory generation if needed, but we're using extra-vars
          # Ensure hvac is installed if GCP auth needs it explicitly, though setup-gcloud usually handles it
          # pip install hvac
          echo "Ansible setup complete."

      - name: Write SSH Private Key for Ansible
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Add known hosts to avoid prompt during connection
          # Get IPs from Terraform output and add to known_hosts
          echo "${{ steps.tf_outputs.outputs.instance_ips }}" | jq -r '.[]' | while read -r ip; do
            echo "Adding $ip to known_hosts"
            ssh-keyscan -H $ip >> ~/.ssh/known_hosts
          done
        working-directory: ./haproxyconfig # Run in the context of haproxyconfig to potentially help with relative paths if needed

      - name: Run Ansible Playbook
        run: |
          # Constructing the Ansible command with dynamic inventory and variables
          ansible-playbook playbook.yml 
            -i inventory.ini 
            -e "ansible_user=${{ secrets.ANSIBLE_SSH_USER }}" 
            -e "ansible_ssh_private_key_file=~/.ssh/id_rsa" 
            -e "project_id=${{ secrets.GCP_PROJECT_ID }}" 
            -e "region=${{ secrets.GCP_REGION }}" 
            -e "ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" 
            -e "instance_public_ips=${{ steps.tf_outputs.outputs.instance_ips }}" 
            -e "instance_names=${{ steps.tf_outputs.outputs.instance_names }}" 
            -e "ANSIBLE_HOST_KEY_CHECKING=False" # Disable host key checking for automation
        working-directory: ./haproxyconfig
        env:
          ANSIBLE_CONFIG: ./ansible.cfg # Optional: if you have a custom ansible.cfg
          ANSIBLE_REMOTE_USER: ${{ secrets.ANSIBLE_SSH_USER }}
          ANSIBLE_HOST_KEY_CHECKING: "False" # Disable host key checking for automation
          # Pass TF_VARs if needed by the playbook's Terraform context, though typically not directly
          # TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          # TF_VAR_region: ${{ secrets.GCP_REGION }}
          # TF_VAR_ssh_user: ${{ secrets.ANSIBLE_SSH_USER }}
          # TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

