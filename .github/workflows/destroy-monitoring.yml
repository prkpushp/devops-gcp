name: Terraform Destroy (Monitoring Infra)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'destroy' to confirm deletion"
        required: true
        default: "no"

permissions:
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest

    env:
      REGION: asia-south1
      ZONE: asia-south1-a

    steps:
      # =========================
      # Safety Check
      # =========================
      - name: Validate confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "destroy" ]; then
            echo "❌ Destroy cancelled. You must type 'destroy' to proceed."
            exit 1
          fi

      # =========================
      # Checkout
      # =========================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================
      # Authenticate GCP
      # =========================
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Setup GCloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # =========================
      # Extract Project ID
      # =========================
      - name: Extract Project ID
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > sa.json
          PROJECT_ID=$(jq -r '.project_id' sa.json)
          echo "PROJECT_ID=$PROJECT_ID" >> $GITHUB_ENV

      # =========================
      # Terraform Setup
      # =========================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        
      - name: Create Terraform Backend Bucket
        run: |
          gsutil ls -b gs://$PROJECT_ID >/dev/null 2>&1 || \
          gsutil mb -p $PROJECT_ID -l $REGION gs://$PROJECT_ID
  
      - name: Generate backend.tf
        run: |
          cat <<EOF > monitoring/terraform/backend.tf
          terraform {
            backend "gcs" {
              bucket = "$PROJECT_ID"
              prefix = "monitoring/dev"
            }
          }
          EOF
        
      - name: Terraform Init
        working-directory: monitoring/terraform/
        run: |
          terraform init -input=false

      # =========================
      # Terraform Destroy (MAIN STEP)
      # =========================
      - name: Terraform Destroy
        working-directory: monitoring/terraform/
        run: |
          terraform destroy -auto-approve \
            -var-file="dev.tfvars" \
            -var="project_id=$PROJECT_ID" \
            -var="region=$REGION" \
            -var="zone=$ZONE" \
            -var="ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}"

      # =========================
      # Summary
      # =========================
      - name: Destroy Summary
        run: |
          echo "==================================="
          echo "Terraform Destroy Completed"
          echo "==================================="
          echo "Project: $PROJECT_ID"
          echo "Region : $REGION"
          echo "Zone   : $ZONE"
          echo "==================================="
