name: CloudScaleOps Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      REGION: asia-south1
      ZONE: asia-south1-a

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==================================================
      # Authenticate to GCP
      # ==================================================

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Setup GCloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # ==================================================
      # Extract Project ID
      # ==================================================

      - name: Extract Project ID
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > sa.json

          PROJECT_ID=$(jq -r '.project_id' sa.json)

          echo "PROJECT_ID=$PROJECT_ID" >> $GITHUB_ENV

          echo "Detected Project ID: $PROJECT_ID"

      # ==================================================
      # Create Terraform Backend Bucket
      # ==================================================

      - name: Create Terraform Backend Bucket
        run: |
          gsutil ls -b gs://$PROJECT_ID >/dev/null 2>&1 || \
          gsutil mb -p $PROJECT_ID -l $REGION gs://$PROJECT_ID

      # ==================================================
      # Generate backend.tf
      # ==================================================

      - name: Generate backend.tf
        run: |
          cat <<EOF > cloudscaleops/terraform/environments/dev/backend.tf
          terraform {
            backend "gcs" {
              bucket = "$PROJECT_ID"
              prefix = "cloudscaleops/dev"
            }
          }
          EOF

      # ==================================================
      # Setup Terraform
      # ==================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # ==================================================
      # Terraform Init
      # ==================================================

      - name: Terraform Init
        working-directory: cloudscaleops/terraform/environments/dev
        run: terraform init

      # ==================================================
      # Terraform Format Check
      # ==================================================

      - name: Terraform Format
        working-directory: cloudscaleops/terraform/environments/dev
        run: terraform fmt -recursive

      # ==================================================
      # Terraform Validate
      # ==================================================

      - name: Terraform Validate
        working-directory: cloudscaleops/terraform/environments/dev
        run: terraform validate

      # ==================================================
      # Terraform Plan
      # ==================================================

      - name: Terraform Plan
        working-directory: cloudscaleops/terraform/environments/dev
        run: |
          terraform plan \
          -var-file="dev.tfvars" \
          -var="project_id=$PROJECT_ID" \
          -var="region=$REGION" \
          -var="zone=$ZONE" \
          -var="ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}"

      # ==================================================
      # Terraform Apply
      # ==================================================

      - name: Terraform Apply
        working-directory: cloudscaleops/terraform/environments/dev
        run: |
          terraform apply -auto-approve \
          -var-file="dev.tfvars" \
          -var="project_id=$PROJECT_ID" \
          -var="region=$REGION" \
          -var="zone=$ZONE" \
          -var="ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}"

      # ==================================================
      # Fetch Load Balancer IP
      # ==================================================

      - name: Fetch Load Balancer IP
        working-directory: cloudscaleops/terraform/environments/dev
        run: |
          LB_IP=$(terraform output -raw load_balancer_ip)

          echo "LB_IP=$LB_IP" >> $GITHUB_ENV

          echo "Load Balancer IP: $LB_IP"

      # ==================================================
      # Install Ansible
      # ==================================================

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      # ==================================================
      # Fetch MIG VM Instances
      # ==================================================

      - name: Fetch MIG Instances
        run: |
          gcloud compute instances list \
          --filter="name~'cloudscaleops'" \
          --format="value(networkInterfaces[0].accessConfigs[0].natIP)" \
          > vm_ips.txt

          cat vm_ips.txt

      # ==================================================
      # Setup SSH Key
      # ==================================================

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa

      - name: Debug VM IPs
        run: |
          echo "======= VM IPS ======="
          cat vm_ips.txt || true
          echo "======================"

      # ==================================================
      # Generate Dynamic Inventory
      # ==================================================

      - name: Generate Dynamic Inventory
        run: |
          mkdir -p cloudscaleops/ansible/inventory
      
          echo "[web]" > cloudscaleops/ansible/inventory/dev.ini
      
          while read ip; do
      
            echo "$ip ansible_user=ubuntu" >> cloudscaleops/ansible/inventory/dev.ini
      
            echo "Waiting for SSH on $ip ..."
      
            timeout 300 bash -c "
              until ssh-keyscan -H $ip >> ~/.ssh/known_hosts 2>/dev/null
              do
                sleep 5
              done
            "
      
          done < vm_ips.txt
      
          cat cloudscaleops/ansible/inventory/dev.ini

      # ==================================================
      # Test SSH Connectivity
      # ==================================================

      - name: Test SSH Connectivity
        run: |
          while read ip; do
            ssh -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            ubuntu@$ip \
            "echo SSH successful on $(hostname)"
          done < vm_ips.txt

      # ==================================================
      # Run Ansible Playbook
      # ==================================================

      - name: Run Ansible Playbook
        working-directory: cloudscaleops/ansible
        run: |
          ansible-playbook \
          -i inventory/dev.ini \
          playbooks/site.yml

      # ==================================================
      # Validate Load Balancer
      # ==================================================

      - name: Validate Load Balancer
        run: |
          curl http://$LB_IP

      # ==================================================
      # Deployment Summary
      # ==================================================

      - name: Deployment Summary
        run: |
          echo "==================================="
          echo "CloudScaleOps Deployment Complete"
          echo "==================================="
          echo "Project ID        : $PROJECT_ID"
          echo "Load Balancer IP  : $LB_IP"
          echo "Application URL  : https://cloud.wealthbridgezone.com"
          echo "==================================="

